cards:
  - id: crd_wzlj16
    front: >-
      Why does a write-up give a change between two releases with its margin?
    back: >-
      Without the margin, the customer can't tell a change the release makes from one the
      questions happened to give.
  - id: crd_wgw3o5
    front: >-
      Why can the faster release be the wrong one to run?
    back: >-
      Speed is one figure: three passages cut the prompt but raised the share of answers citing
      the wrong pages by more than the margin, and a wrong answer costs a student more than a
      slower one.
