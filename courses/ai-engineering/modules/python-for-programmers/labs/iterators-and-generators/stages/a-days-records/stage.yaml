      `report` read lines after its last failure's. Read them as the failures are asked for.
  - check: tst_oupytg
    title: Holds one record at a time
    requires: >-
      Reporting on a day of {% $fig.lines %} lines, `report` never holds more than
      {% $fig.memory %} of Python objects at once.
    failure: >-
      `report` held more than it may. Read each line and check its record before reading
      the next.
