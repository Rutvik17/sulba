id: lab_wg2xzy
title: Types, tests and packages
summary: >-
  Port superstruct's types: type hints that mypy checks in strict mode, generic structs that
  narrow what a value is, tests with pytest that catch a change that breaks the port, and a
  check of the packages uv locks for the service against the clinic's approved list.
