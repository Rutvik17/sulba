id: lab_ubeuqv
title: Arrays and broadcasting
summary: >-
  Find the past samples most like each new breast mass sample, in NumPy: standardize thirty
  measurements at once, measure every distance by broadcasting, and keep the search within its
  memory as the records grow.
data:
  - file: breast-cancer.csv
    title: Breast Cancer Wisconsin (Diagnostic)
    creators: [William Wolberg, Olvi Mangasarian, Nick Street, W. Street]
    url: https://doi.org/10.24432/C5DW2B
    licence:
      name: CC BY 4.0
      url: https://creativecommons.org/licenses/by/4.0/
    changes: >-
      Split into a training set and a test set, with malignant coded as 1 and each column
      named.
stages: [arrays-and-axes, broadcasting, the-nearest-records, the-assistants-search, searching-within-memory]
