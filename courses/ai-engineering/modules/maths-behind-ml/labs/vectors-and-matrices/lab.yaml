id: lab_6cfbs9
title: Vectors and matrices
summary: >-
  Treat each breast mass sample as a vector in NumPy: score it along the line from the average
  benign sample to the average malignant one, and work out every distance between samples at
  once with the matrix product.
data:
  - file: breast-cancer.csv
    title: Breast Cancer Wisconsin (Diagnostic)
    creators: [William Wolberg, Olvi Mangasarian, Nick Street, W. Street]
    url: https://doi.org/10.24432/C5DW2B
    licence:
      name: CC BY 4.0
      url: https://creativecommons.org/licenses/by/4.0/
    changes: >-
      Split into a training set and a test set, with malignant coded as 1 and each column
      named.
stages: [dot-products, a-direction-between-the-classes, the-matrix-product, the-assistants-screen, distances-far-from-zero]
