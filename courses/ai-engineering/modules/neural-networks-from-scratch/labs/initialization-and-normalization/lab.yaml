id: lab_t9mjtn
title: Initialization and normalization
summary: >-
  Train a deep network: start its weights as torch.nn.init starts them, so that the signal
  keeps its size through every layer, then build batch and layer normalization, each matched
  to PyTorch's outputs and gradients, until the network trains where it stalled.
data:
  - file: digits.csv
    title: Optical Recognition of Handwritten Digits
    creators: [E. Alpaydin, C. Kaynak]
    url: https://doi.org/10.24432/C50P49
    licence:
      name: CC BY 4.0
      url: https://creativecommons.org/licenses/by/4.0/
    changes: >-
      UCI's training and test files joined under a header, with a column that puts each digit
      in the training, validation or test set. The validation set is a quarter of the training
      file's digits, chosen at random within each digit.
references: [init.json, norms.json]
stages:
  - spread-through-depth
  - batch-normalization
  - layer-normalization
  - the-assistants-normalization
  - training-a-deep-network
