id: lab_2pob1q
title: Calling a model
summary: >-
  Connect a bicycle repair shop's assistant to a model through the chat completions API:
  requests and replies by hand over HTTP, the tokens a conversation takes and the model's
  window, a month of the shop's questions priced from providers' published prices, a review of
  an assistant's client, and a client that retries what it can within a deadline.
