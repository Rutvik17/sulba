id: lab_2eli1f
title: Structured output
summary: >-
  Hold the bicycle repair shop's assistant to JSON its calendar can take: a JSON Schema
  validator for the keywords the shop uses, replies checked and asked for again with their
  errors, constrained decoding that masks every token that can't continue a valid reply, a review
  of an assistant's extractor, and an extractor that turns the shop's emails into bookings.
