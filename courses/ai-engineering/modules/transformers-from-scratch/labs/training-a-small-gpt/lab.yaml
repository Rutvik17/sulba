id: lab_82nv8v
title: Training a small GPT
summary: >-
  Train the reading app's story model on your own machine: a tokenizer learnt from the stories,
  batches of tokens packed as GPT-3 packs its documents, a training loop with AdamW, warm-up,
  cosine decay and clipping, a review of an assistant's trainer, and a model that beats a target
  loss within a budget of compute.
