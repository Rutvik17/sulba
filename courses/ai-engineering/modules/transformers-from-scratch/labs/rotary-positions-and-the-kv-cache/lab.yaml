id: lab_hjn5es
title: Rotary positions and the KV cache
summary: >-
  Run Hugging Face's SmolLM2-135M in your own code: rotary positions, RMSNorm, SwiGLU and
  grouped-query attention matched to transformers' Llama, a KV cache that writes each token
  without reading the story again, a review of an assistant's cached generator, and a generator
  for batches of prompts.
