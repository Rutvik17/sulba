id: lab_7t1q62
title: GPT-2's weights
summary: >-
  Run OpenAI's GPT-2 in the reading app's own GPT: its weights read by hand from their file,
  its tokenizer built from its published vocabulary and merges, its tensors mapped into your
  model until its predictions match Hugging Face's, a review of an assistant's loader, and a
  loader for any GPT-2 that refuses a damaged file.
fetch:
