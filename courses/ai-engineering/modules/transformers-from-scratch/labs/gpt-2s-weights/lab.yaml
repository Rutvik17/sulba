    title: GPT-2
    creators: [OpenAI]
    url: https://github.com/openai/gpt-2
    licence:
      name: Modified MIT License
      url: https://github.com/openai/gpt-2/blob/9b63575ef42771a015060c964af2c3da4cf7c8ab/LICENSE
    files:
      - file: model.safetensors
        url: https://huggingface.co/openai-community/gpt2/resolve/607a30d783dfa663caf39e06633721c8d4cfcd7e/model.safetensors
        bytes: 548105171
        sha256: 248dfc3911869ec493c76e65bf2fcf7f615828b0254c12b473182f0f81d3a707
      - file: vocab.json
        url: https://huggingface.co/openai-community/gpt2/resolve/607a30d783dfa663caf39e06633721c8d4cfcd7e/vocab.json
        bytes: 1042301
        sha256: 196139668be63f3b5d6574427317ae82f612a97c5d1cdaf36ed2256dbf636783
      - file: merges.txt
        url: https://huggingface.co/openai-community/gpt2/resolve/607a30d783dfa663caf39e06633721c8d4cfcd7e/merges.txt
