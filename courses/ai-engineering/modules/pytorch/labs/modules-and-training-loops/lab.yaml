id: lab_6wrotn
title: Modules and training loops
summary: >-
  Train the records office's deep reader the way PyTorch code does: its layers as modules,
  its digits from a data loader, its validation in evaluation mode, and checkpoints that
  pick up a stopped run exactly where it was.
data:
  - file: digits.csv
    title: Optical Recognition of Handwritten Digits
    creators: [E. Alpaydin, C. Kaynak]
    url: https://doi.org/10.24432/C50P49
    licence:
      name: CC BY 4.0
      url: https://creativecommons.org/licenses/by/4.0/
    changes: >-
      UCI's training and test files joined under a header, with a column that puts each digit
      in the training, validation or test set. The validation set is a quarter of the training
      file's digits, chosen at random within each digit.
runs: machine
stages:
  - modules
  - datasets-and-loaders
  - checkpoints
  - the-assistants-training-run
  - resumable-training
