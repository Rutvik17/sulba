id: lab_038pc7
title: Convolutional networks
summary: >-
  Sort an online shop's photos of clothes with a convolutional network: convolution and
  pooling by hand, the photos' files read and checked, a network that trains on any device and
  in mixed precision, a review of an assistant's classifier, and a classifier that beats the
  shop's perceptron within a budget of compute.
