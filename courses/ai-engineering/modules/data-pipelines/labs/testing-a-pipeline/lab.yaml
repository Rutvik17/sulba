id: lab_5ipery
title: Testing a pipeline
summary: >-
  Join a month of New York's cab trips to the taxi zones and to Central Park's weather with
  Spark, and test the pipeline that does it: NOAA's daily weather file read into units, each
  borough's trips on every day of August, wet days against dry days of the same weekday, a
  review of an assistant's daily table, and tests of your own that catch the mistakes planted
  in the pipeline.
data:
  - file: central-park-2025-08.csv
    title: Global Historical Climatology Network - Daily (GHCN-Daily), Version 3
    creators:
      - Matthew J. Menne
      - Imke Durre
      - Bryant Korzeniewski
      - Shelley McNeill
      - Kristy Thomas
      - Xungang Yin
      - Steven Anthony
      - Ron Ray
      - Russell S. Vose
      - Byron E. Gleason
      - Tamara G. Houston
    url: https://www.ncei.noaa.gov/products/land-based-station/global-historical-climatology-network-daily
    licence:
      name: Cite as NCEI asks, no other use constraints
      url: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C00861
    changes: >-
      None: August 2025 at Central Park, New York, station USW00094728, as NCEI's Access Data
      Service gave it on 25 October 2026, from version 3.35-upd-2026102317.
