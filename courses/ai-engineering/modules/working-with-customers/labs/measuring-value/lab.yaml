id: lab_scbp4g
title: Measuring value
summary: >-
  Work out what the help desk is worth to the benefits office from its agent's trials: each kind
  of contact's share done, counting each task once; the share of the office's own contacts,
  weighted by its mix; the net saving a month and the months the pilot takes to pay for itself,
  each with its interval; a review of an assistant's value report; and the summary the office
  reads, with every interval rounded outward.
data:
  - file: runs.csv
    title: MultiDoc2Dial
    creators: [Song Feng, Siva Sankalp Patel, Hui Wan, Sachindra Joshi]
    url: https://doc2dial.github.io/multidoc2dial/
    licence:
      name: CC BY 3.0
      url: https://creativecommons.org/licenses/by/3.0/
    changes: >-
      Each of the Tools and planning lab's 120 tasks done five times by the Workflows and agents
      lab's agent, on that lab's tools, and five times by the Tools and planning lab's agent, on
      its tools, with Qwen3.5-4B at 4 bits and nomic-embed-text-v1.5 at 8 bits, through
      llama.cpp's server, release b11734, on machines with 4 CPU cores and no GPU, on 21 and 22
      October 2026, each run with a seed of its own, the same for both agents, at the sampling
      settings Qwen3.5-4B's model card gives for its non-thinking mode, with whether the task was
      done, the seconds the run took, its requests, their tokens of prompt and of reply, and the
      tools the model called in each request.
stages:
  - each-kind-of-contact
  - the-offices-mix
  - what-its-worth
  - the-assistants-report
  - a-summary-for-the-office
