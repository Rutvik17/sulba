[project]
name = "shipping-the-desk"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
  "fastapi==0.136.1",
  "httpx==0.28.1",
  "numpy==2.4.6",
  "psycopg[binary]==3.3.5",
  "psycopg-pool==3.3.3",
  "pyjwt[crypto]==2.15.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
# What the tests use, which the image leaves out.
dev = ["embedded-postgres==18.6.3", "pytest==9.0.2"]

[tool.uv]
package = false
# The versions the browser runs.
constraint-dependencies = [
  "annotated-doc==0.0.4",
  "annotated-types==0.7.0",
  "anyio==4.13.0",
  "certifi==2026.4.22",
  "cffi==2.0.0",
  "click==8.3.1",
  "cryptography==47.0.0",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "idna==3.11",
  "iniconfig==2.3.0",
  "packaging==26.1",
  "pluggy==1.6.0",
  "pycparser==3.0",
  "pydantic==2.12.5",
  "pydantic-core==2.41.5",
  "pygments==2.20.0",
  "starlette==1.0.0",
  "typing-extensions==4.15.0",
  "typing-inspection==0.4.2",
]
