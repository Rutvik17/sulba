id: lab_9b4kj9
title: Tools and planning
summary: >-
  Write the help desk's tools for the model that calls them: search results it can cite, lists
  that say what they leave out, and errors that say how to call again; tickets and callbacks the
  model proposes and the desk makes only on the caller's yes, after looking up what they need;
  the agent on those tools; a review of an assistant's proposals; and callbacks that move.
data:
  - file: passages.csv
    title: MultiDoc2Dial
    creators: [Song Feng, Siva Sankalp Patel, Hui Wan, Sachindra Joshi]
    url: https://doc2dial.github.io/multidoc2dial/
    licence:
      name: CC BY 3.0
      url: https://creativecommons.org/licenses/by/3.0/
    changes: >-
      The dataset's 488 help pages in passages: each page's text taken from its HTML, with its
      headings marked by #s and its list items by -, and its blocks joined into passages of up
      to 200 words. Each passage has its page, the page's domain, and the page's title without
      the part number the dataset adds.
  - file: passage-vectors.csv
    title: MultiDoc2Dial
    creators: [Song Feng, Siva Sankalp Patel, Hui Wan, Sachindra Joshi]
    url: https://doc2dial.github.io/multidoc2dial/
    licence:
      name: CC BY 3.0
      url: https://creativecommons.org/licenses/by/3.0/
    changes: >-
      Each passage's vector from nomic-embed-text-v1.5 at 8 bits, embedded after
      `search_document: `, one text a request, by llama.cpp's server, release b11734, each
      number times 32,767, rounded.
  - file: tasks.json
    title: MultiDoc2Dial
    creators: [Song Feng, Siva Sankalp Patel, Hui Wan, Sachindra Joshi]
    url: https://doc2dial.github.io/multidoc2dial/
    licence:
      name: CC BY 3.0
      url: https://creativecommons.org/licenses/by/3.0/
    changes: >-
      The help desk's 120 tasks, written for the lab: 40 of the dataset's opening questions
      from its test dialogues, of seven words or more, 10 for each service, drawn at random,
      with the passages that hold each one's answer; and 80 conversations about the caller's
      tickets and callbacks, each with the caller's messages, tickets and the advisers' free
      times.
  - file: runs.csv
    title: MultiDoc2Dial
    creators: [Song Feng, Siva Sankalp Patel, Hui Wan, Sachindra Joshi]
    url: https://doc2dial.github.io/multidoc2dial/
    licence:
      name: CC BY 3.0
      url: https://creativecommons.org/licenses/by/3.0/
    changes: >-
      Each task done five times by the Workflows and agents lab's agent, on that lab's tools,
      and five times by this lab's agent, on this lab's tools, with Qwen3.5-4B at 4 bits and
      nomic-embed-text-v1.5 at 8 bits, through llama.cpp's server, release b11734, on machines
      with 4 CPU cores and no GPU, on 21 and 22 October 2026, each run with a seed of its own,
      the same for both agents, at the sampling settings Qwen3.5-4B's model card gives for its
      non-thinking mode, with whether the task was done, the seconds the run took, its
      requests, their tokens of prompt and of reply, and the tools the model called in each
      request.
