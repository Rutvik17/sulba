name: Spike

# Runs Postgres with pgvector three ways, and llama.cpp's server with embedding and reranking
# models, on each system the Intermediate level supports, before the Retrieval module's decision
# records. This branch is never merged.
on:
  push:
    branches: [spike/retrieval]

permissions:
  contents: read

jobs:
  database:
    name: Database tests on ${{ matrix.os }}
    if: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-14, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: packages/lab/python/pyproject.toml
      - shell: bash
        run: uv run --directory packages/lab/python pytest -v -p no:cacheprovider tests/test_database.py

  models:
    name: Router on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: packages/lab/python/pyproject.toml
      - shell: bash
        run: uv run --no-project --python 3.14 tools/spike/router.py "$RUNNER_TEMP/spike"
      - if: always()
        shell: bash
        run: tail -n 40 "$RUNNER_TEMP"/spike/*.log || true
