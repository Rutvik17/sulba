name: Deploy

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache in a job that holds deploy credentials: a poisoned cache could read them.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy
        id: deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          if [ "$BRANCH" = main ]; then
            pnpm exec wrangler deploy --message "$GITHUB_SHA"
            url=https://sulba.dev
          else
            # An alias is lowercase letters, digits and dashes, starts with a letter, and fits a
            # 63-character DNS label together with "-web".
            alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^[^a-z]+//' | cut -c 1-59 | sed -E 's/-+$//')
            pnpm exec wrangler versions upload --preview-alias "${alias:-preview}" --message "$GITHUB_SHA"
            url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // .preview_url' "$WRANGLER_OUTPUT_FILE_PATH")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
