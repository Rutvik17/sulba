name: Deploy

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-26.04
    # The build computes every stage's figures afresh, which takes longer as the courses grow.
    timeout-minutes: 45
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache in a job that holds deploy credentials: a poisoned cache could read them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # A lab that runs on the learner's machine computes its figures in CPython, in its own project,
      # with the files it fetches, which the build fetches from their publishers again.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: packages/lab/python/pyproject.toml
          enable-cache: false
      - name: Build
        env:
          SITE_KEY: ${{ github.ref_name == 'main' && vars.TURNSTILE_SITE_KEY || '' }}
          # Previews have the component gallery; sulba.dev doesn't.
          SULBA_GALLERY: ${{ github.ref_name != 'main' && 'on' || '' }}
        # main gets Turnstile's real site key; previews keep the test key, so they can't send mail.
        run: |
          if [ -n "$SITE_KEY" ]; then export PUBLIC_TURNSTILE_SITE_KEY="$SITE_KEY"; fi
          pnpm build
      - name: Deploy
        id: deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A pull request's own branch, or main on a push.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          if [ "$BRANCH" = main ]; then
            pnpm exec wrangler deploy --message "$GITHUB_SHA"
            url=https://sulba.dev
          else
            # One Preview per branch; preview-cleanup.yml deletes it with the branch.
            name=$(bash "$GITHUB_WORKSPACE/.github/scripts/preview-name.sh" "$BRANCH")
            pnpm exec wrangler preview --name "$name" --message "$GITHUB_SHA"
            url=$(jq -r 'select(.type == "preview") | .preview_urls[0]' "$WRANGLER_OUTPUT_FILE_PATH")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
