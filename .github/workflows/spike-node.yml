# Spike: runs a typed DOM test with Node 24.22.1 from nodejs.org and typescript 7.0.2 and
# happy-dom 21.0.4 from npm, through node --test and tsc, on each system a learner may have.
name: Spike Node stages
on:
  push:
    branches: [spike/node-stages]
    paths: [spike/node-stages/**, .github/workflows/spike-node.yml]
permissions:
  contents: read
jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run --no-project --python 3.14 spike/node-stages/run.py
