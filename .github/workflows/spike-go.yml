# Spike: runs a package's tests with Go 1.27.3 from go.dev through go test -json, on each system a
# learner may have.
name: Spike Go stages
on:
  push:
    branches: [spike/go-stages]
    paths: [spike/go-stages/**, .github/workflows/spike-go.yml]
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run --no-project --python 3.14 spike/go-stages/run.py
