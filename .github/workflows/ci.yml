name: CI

# One run per commit: every pull request, and every push to main. Required checks then always come
# from a run that happened, never from a skipped duplicate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # uv fails instead of updating uv.lock when it no longer matches pyproject.toml.
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The lab's Python side runs in CPython at the versions Pyodide ships (packages/lab/python).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: packages/lab/python/pyproject.toml
          enable-cache: true
          cache-dependency-glob: packages/lab/python/uv.lock
      - run: pnpm exec biome ci --reporter=github
      - run: pnpm lint:python
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:python
      - run: pnpm check:content
      - run: pnpm build

  screenshots:
    name: Screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Playwright's image fixes the browser, its system libraries and its fonts, so a screenshot
    # taken here matches the ones committed in apps/web/screenshots. It moves with Playwright's
    # version in apps/web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare the gallery with its screenshots
        run: pnpm --filter @sulba/web screenshots
      # When the look has changed, take the new screenshots and attach them to the run, with the
      # report that shows each difference (CONTRIBUTING.md).
      - name: Take new screenshots
        if: failure()
        run: pnpm --filter @sulba/web screenshots --update-snapshots=changed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: screenshots
          path: |
            apps/web/screenshots/
            apps/web/screenshot-report/
          retention-days: 7

  deploy:
    name: Deploy
    needs: [checks]
    # main deploys to sulba.dev and pull requests from this repository get a preview. Dependency
    # updates and pull requests from forks, which have no access to secrets, are tested only.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'renovate/'))
    uses: ./.github/workflows/deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
