# The Python side of the lab: the runner every session's tests go through, with the same
# versions Pyodide 314.0.7 ships, so a run on a learner's machine matches one in the browser.
[project]
name = "sulba-lab"
version = "0"
requires-python = "==3.14.2"
dependencies = [
  "lightgbm==4.6.0",
  "mypy==1.19.1",
  "numpy==2.4.6",
  "pandas==3.0.2",
  "pytest==9.0.2",
  "regex==2026.3.32",
  "scikit-learn==1.8.0",
  "scipy==1.18.0",
  "tiktoken==0.12.0",
  "xgboost==2.1.4",
]

[dependency-groups]
dev = ["ruff==0.16.10"]

[tool.uv]
package = false
required-version = "==0.12.23"
# XGBoost's Linux wheels need NVIDIA's NCCL only to train across GPUs. Labs train on the CPU, as
# Pyodide's build does.
exclude-dependencies = [
  { package = { name = "xgboost", version = "2.1.4" }, dependencies = ["nvidia-nccl-cu12"] },
]
# pytest's, pandas', scikit-learn's, tiktoken's and mypy's own dependencies, at the versions Pyodide
# ships, or for the two it doesn't, the versions the site serves. A test fails if any package in
# uv.lock and in Pyodide's lock file differ.
constraint-dependencies = [
  "certifi==2026.4.22",
  "charset-normalizer==3.4.7",
  "idna==3.11",
  "iniconfig==2.3.0",
  "joblib==1.5.3",
  "librt==0.8.1",
  "mypy-extensions==1.1.0",
  "packaging==26.1",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "pygments==2.20.0",
  "python-dateutil==2.9.0.post0",
  "requests==2.33.1",
  "six==1.17.0",
  "threadpoolctl==3.6.0",
  "typing-extensions==4.15.0",
  "tzdata==2025.3",
  "urllib3==2.6.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
