# The Python side of the lab: the runner every session's tests go through, with the same
# versions Pyodide 314.0.7 ships, so a run on a learner's machine matches one in the browser.
[project]
name = "sulba-lab"
version = "0"
requires-python = "==3.14.2"
dependencies = [
  "fastapi==0.136.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "jsonschema==4.26.0",
  "lightgbm==4.6.0",
  "mypy==1.19.1",
  "numpy==2.4.6",
  "openai==2.30.0",
  "packaging==26.1",
  "pandas==3.0.2",
  "pillow==12.2.0",
  "pytest==9.0.2",
  "regex==2026.3.32",
  "scikit-learn==1.8.0",
  "scipy==1.18.0",
  "tiktoken==0.12.0",
  "xgboost==2.1.4",
]

[dependency-groups]
# Postgres with pgvector, and psycopg to reach it, for the tests of the database fixture (decision
# record 33), PyJWT and cryptography for the tests of the identity fixture (decision record 38),
# and Sail with PySpark's client for those of the spark fixture (decision record 41): machine labs'
# projects have them, and of these the browser has only cryptography.
dev = [
  "cryptography==47.0.0",
  "embedded-postgres==18.6.3",
  "pgvector==0.5.1",
  "psycopg[binary]==3.3.5",
  "pyjwt==2.15.1",
  "pysail==0.7.2",
  "pyspark-client==4.2.0",
  "ruff==0.17.2",
]

[tool.uv]
package = false
required-version = "==0.12.23"
# XGBoost's Linux wheels need NVIDIA's NCCL only to train across GPUs. Labs train on the CPU, as
# Pyodide's build does.
exclude-dependencies = [
  { package = { name = "xgboost", version = "2.1.4" }, dependencies = ["nvidia-nccl-cu12"] },
]
# pytest's, pandas', scikit-learn's, tiktoken's, mypy's, FastAPI's, HTTPX's, OpenAI's, jsonschema's,
# Jinja's, cryptography's and PySpark's client's own dependencies, at the versions Pyodide ships,
# or for the two it doesn't, the versions the site serves. A test fails if any package in uv.lock
# and in Pyodide's lock file differ.
constraint-dependencies = [
  "annotated-doc==0.0.4",
  "annotated-types==0.7.0",
  "anyio==4.13.0",
  "attrs==26.1.0",
  "certifi==2026.4.22",
  "cffi==2.0.0",
  "charset-normalizer==3.4.7",
  "distro==1.9.0",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "idna==3.11",
  "iniconfig==2.3.0",
  "jiter==0.13.0",
  "joblib==1.5.3",
  "jsonschema-specifications==2025.9.1",
  "librt==0.8.1",
  "markupsafe==3.0.3",
  "mypy-extensions==1.1.0",
  "pathspec==1.1.1",
  "platformdirs==4.9.4",
  "pluggy==1.6.0",
  "protobuf==7.34.1",
  "pyarrow==22.0.0",
  "pycparser==3.0",
  "pydantic==2.12.5",
  "pydantic-core==2.41.5",
  "pygments==2.20.0",
  "python-dateutil==2.9.0.post0",
  "pyyaml==6.0.3",
  "referencing==0.37.0",
  "requests==2.33.1",
  "rpds-py==0.30.0",
  "six==1.17.0",
  "sniffio==1.3.1",
  "starlette==1.0.0",
  "threadpoolctl==3.6.0",
  "tqdm==4.67.3",
  "typing-extensions==4.15.0",
  "typing-inspection==0.4.2",
  "tzdata==2025.3",
  "urllib3==2.6.3",
  "zstandard==0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
