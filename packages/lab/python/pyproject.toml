# The Python side of the lab: the runner every session's tests go through, with the same
# versions Pyodide 314.0.7 ships, so a run on a learner's machine matches one in the browser.
[project]
name = "sulba-lab"
version = "0"
requires-python = "==3.14.2"
dependencies = ["numpy==2.4.6", "pytest==9.0.2", "scikit-learn==1.8.0"]

[dependency-groups]
dev = ["ruff==0.16.10"]

[tool.uv]
package = false
required-version = "==0.12.23"
# pytest's and scikit-learn's own dependencies, at the versions Pyodide ships. A test fails if
# any package in uv.lock and in Pyodide's lock file differ.
constraint-dependencies = [
  "iniconfig==2.3.0",
  "joblib==1.5.3",
  "packaging==26.1",
  "pluggy==1.6.0",
  "pygments==2.20.0",
  "scipy==1.18.0",
  "threadpoolctl==3.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
